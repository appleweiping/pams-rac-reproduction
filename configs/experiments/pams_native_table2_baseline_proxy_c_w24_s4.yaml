# CANDIDATE C - NATIVE TABLE-2 PROXY: WINDOW 24 / ANCHOR STRIDE 4.
#
# This is an independently inferred executable proxy for the conventional-TCC
# baseline named in PAMS Table 2.  The paper discloses the broad architecture,
# a fixed-window conventional-TCC baseline, frame negatives from other videos,
# and skeleton rotation/scale/jitter augmentation.  It does not uniquely
# disclose the fixed period, sparse-anchor indexing convention, augmentation
# magnitudes, or every optimization detail.  This is not the authors' baseline
# and is never eligible to claim their Table-2 number.
#
# The pose block must exactly match a separately authorized train337 native-
# timeline recovery artifact before the formal runner can launch.  The current
# v4a-shaped block is retained only as a fail-closed placeholder: v4a failed
# its paired gate and is explicitly rejected by the runner.  The eventual
# authorized recovery config must be frozen here in a reviewed commit.
# data.frames remains the historical schema field; native caches retain their
# variable lengths and training batches pad only at collation time.
# period.maximum=4096 is only a non-binding safety ceiling;
# maximum_mode=half_timeline applies the per-sample native-duration bound.
# dense_resampled freezes direct FFT fallback to that same native clock. None
# of these values may be tuned on dev84 or test105.
schema_version: 1
protocol: ucfrep_526
seed: 2026
data:
  frames: 256
  keypoints: 33
  coordinates: 3
  normalization: per_frame_minmax
  missing_value: 0.0
pose:
  preprocessing_revision: official-segment-heavy-missing-retry-full-timeline-v4a
  model_id: mediapipe-pose-0.10.14
  model_complexity: 1
  smooth_landmarks: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  crop_to_detected_span: false
  incomplete_clip_policy: pad_invalid_tail
  recovery:
    heavy_model_id: mediapipe-pose-heavy-0.10.14
    model_complexity: 2
    heavy_model_asset_sha256: 59e42d71bcd44cbdbabc419f0ff76686595fd265419566bd4009ef703ea8e1fe
    temporal_resampling: none_native_timeline
    static_image_mode: true
    smooth_landmarks: false
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    full_frame_retry: true
    roi_retry: true
    roi_margin_fraction: 0.20
    roi_min_side_fraction: 0.08
    association_cost: normalized-center-l2-plus-log-scale-v1
    association_center_weight: 1.0
    association_log_scale_weight: 0.25
    dominant_track_strategy: global-viterbi-visible-extent-v1
    maximum_gap_frames: 8
    maximum_gap_seconds: 0.25
    pose_coordinate_interpolation: false
model:
  input_dim: 99
  model_dim: 512
  input_projection_scale: none
  position_encoding_mode: sinusoidal
  embedding_dim: 512
  layers: 4
  heads: 16
  feedforward_dim: 2048
  dropout: 0.1
  norm_first: false
  period_head_hidden_dim: 128
period:
  minimum: 4
  maximum: 4096
  maximum_mode: half_timeline
  pose_energy_epochs: 10
  training_mode: fixed_period_inferred
  fixed_period_frames: 24
  # Unused by fixed_period_inferred, retained as an explicit schema value.
  post_warmup_source: embedding_velocity_coordinate
  direct_fft_timebase: dense_resampled
loss:
  # Table 2 describes the conventional-TCC baseline as non-multi-scale.
  scales: [1.0]
  temperature: 0.1
  # Candidate C uses one preregistered point from the paper's disclosed sweep.
  anchor_stride: 4
  kmeans_clusters: 8
  kmeans_refresh_epochs: 5
  # Disable the reproduction's inferred prototype-bank negatives.  The TCC
  # implementation still retains every valid frame from other batch videos as
  # paper-disclosed negatives.
  use_cross_cluster_negatives: false
  exclude_other_scale_positives_from_denominator: false
training:
  epochs: 150
  effective_batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 8
  minimum_learning_rate: 0.000001
  position_permutation_consistency_weight: 0.0
  skeleton_augmentation:
    enabled: true
    # Rotation/scale/jitter are paper-disclosed augmentation families; these
    # numerical magnitudes are independently inferred, not author-disclosed.
    rotation_degrees: [15.0, 15.0, 15.0]
    scale_range: [0.85, 1.15]
    jitter_std: 0.01
sshead:
  # Present only because it is part of the shared config schema.  The formal
  # runner never trains this undisclosed target head.
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  architecture: pointwise_mlp
  input_source: encoder_embedding
  period_confidence_mode: nonzero_gate
  cycle_weight: 1.0
  spectral_weight: 1.0
  variance_weight: 0.1
  smoothness_weight: 0.01
consensus:
  # Unused: this runner stops after representation learning and never predicts.
  expert_mode: multi
  sigma_multipliers: [0.05, 0.12, 0.15]
  distance_multipliers: [0.5, 0.8, 1.2]
  short_window_multiplier: 0.5
  long_window_multiplier: 2.0
  height_factor: 0.6
  prominence_factor: 0.25
  long_window_weight: 0.6
readout:
  # Target-free inference readout; this remains an independently inferred
  # reproduction choice, not an author-disclosed Period Head implementation.
  action_curve_source: embedding_recurrence_carrier
