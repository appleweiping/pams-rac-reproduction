# TRAIN337-ONLY POSE-INPUT REPAIR (v4c; no model training authorized here).
#
# Pass 0 is the frozen MediaPipe Solutions complexity-1 VIDEO track. Pass 1 is
# the official Tasks Heavy PoseLandmarker bundle in VIDEO mode with num_poses=4
# over every decoded frame. On pass0-valid frames the graph exposes only the
# immutable pass0 singleton; Tasks candidates are exposed only at pass0 misses.
# One whole-segment Viterbi path therefore uses pass0 anchors to disambiguate
# people. Detector-order permutations are canonicalized before association.
schema_version: 1
protocol: ucfrep_526
seed: 2026
data:
  frames: 256
  keypoints: 33
  coordinates: 3
  normalization: per_frame_minmax
  missing_value: 0.0
pose:
  preprocessing_revision: official-segment-tasks-heavy-video-multipose4-fill-missing-full-timeline-v4c
  model_id: mediapipe-pose-0.10.14
  model_complexity: 1
  smooth_landmarks: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  crop_to_detected_span: false
  incomplete_clip_policy: pad_invalid_tail
  recovery:
    heavy_model_id: mediapipe-tasks-pose-landmarker-heavy-0.10.14-num-poses-4
    model_complexity: 2
    heavy_model_asset_sha256: 64437af838a65d18e5ba7a0d39b465540069bc8aae8308de3e318aad31fcbc7b
    temporal_resampling: none_native_timeline
    static_image_mode: false
    smooth_landmarks: true
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    full_frame_retry: true
    roi_retry: false
    roi_margin_fraction: 0.20
    roi_min_side_fraction: 0.08
    association_cost: normalized-center-l2-plus-log-scale-v1
    association_center_weight: 1.0
    association_log_scale_weight: 0.25
    dominant_track_strategy: global-viterbi-visible-extent-v1
    maximum_gap_frames: 8
    maximum_gap_seconds: 0.25
    pose_coordinate_interpolation: false
model:
  input_dim: 99
  model_dim: 512
  input_projection_scale: none
  position_encoding_mode: none
  embedding_dim: 512
  layers: 4
  heads: 16
  feedforward_dim: 2048
  dropout: 0.1
  norm_first: false
  period_head_hidden_dim: 128
period:
  minimum: 4
  maximum: 128
  pose_energy_epochs: 10
  training_mode: adaptive
  fixed_period_frames: 16
  post_warmup_source: projected_pose_velocity_vector_acf
loss:
  scales: [0.5, 1.0, 1.5]
  temperature: 0.1
  kmeans_clusters: 8
  kmeans_refresh_epochs: 5
  exclude_other_scale_positives_from_denominator: false
