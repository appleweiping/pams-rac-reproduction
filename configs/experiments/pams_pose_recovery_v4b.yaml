# TRAIN337-ONLY POSE-INPUT REPAIR (v4b; no model training authorized here).
#
# Pass 0 is the frozen MediaPipe 0.10.14 complexity-1 VIDEO pass over the
# complete annotation-compiled official-segment timeline. Pass 1 is the
# verified complexity-2 model in VIDEO mode over every decoded frame. Pass 1
# may fill only pass0-invalid frames; pass0 coordinates are immutable.
#
# The runner never downloads model bytes. It requires the exact preseeded
# heavy TFLite asset and verifies its identity before and after extraction.
# No pose coordinates are interpolated, no native frame is resampled, and an
# early-EOF tail remains exact-zero/mask-false without detector invocation.
schema_version: 1
protocol: ucfrep_526
seed: 2026
data:
  frames: 256
  keypoints: 33
  coordinates: 3
  normalization: per_frame_minmax
  missing_value: 0.0
pose:
  preprocessing_revision: official-segment-heavy-video-fill-missing-full-timeline-v4b
  model_id: mediapipe-pose-0.10.14
  model_complexity: 1
  smooth_landmarks: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  crop_to_detected_span: false
  incomplete_clip_policy: pad_invalid_tail
  recovery:
    heavy_model_id: mediapipe-pose-heavy-video-0.10.14
    model_complexity: 2
    heavy_model_asset_sha256: 59e42d71bcd44cbdbabc419f0ff76686595fd265419566bd4009ef703ea8e1fe
    temporal_resampling: none_native_timeline
    static_image_mode: false
    smooth_landmarks: true
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    full_frame_retry: true
    roi_retry: false
    roi_margin_fraction: 0.20
    roi_min_side_fraction: 0.08
    association_cost: normalized-center-l2-plus-log-scale-v1
    association_center_weight: 1.0
    association_log_scale_weight: 0.25
    dominant_track_strategy: global-viterbi-visible-extent-v1
    maximum_gap_frames: 8
    maximum_gap_seconds: 0.25
    pose_coordinate_interpolation: false
model:
  input_dim: 99
  model_dim: 512
  input_projection_scale: none
  position_encoding_mode: none
  embedding_dim: 512
  layers: 4
  heads: 16
  feedforward_dim: 2048
  dropout: 0.1
  norm_first: false
  period_head_hidden_dim: 128
period:
  minimum: 4
  maximum: 128
  pose_energy_epochs: 10
  training_mode: adaptive
  fixed_period_frames: 16
  post_warmup_source: projected_pose_velocity_vector_acf
loss:
  scales: [0.5, 1.0, 1.5]
  temperature: 0.1
  kmeans_clusters: 8
  kmeans_refresh_epochs: 5
  exclude_other_scale_positives_from_denominator: false
training:
  epochs: 150
  effective_batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 8
  minimum_learning_rate: 0.000001
  position_permutation_consistency_weight: 0.0
  skeleton_augmentation:
    enabled: true
    rotation_degrees: [15.0, 15.0, 15.0]
    scale_range: [0.85, 1.15]
    jitter_std: 0.01
sshead:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  architecture: pointwise_mlp
  input_source: encoder_embedding
  period_confidence_mode: nonzero_gate
  cycle_weight: 1.0
  spectral_weight: 1.0
  variance_weight: 0.1
  smoothness_weight: 0.01
consensus:
  expert_mode: multi
  sigma_multipliers: [0.05, 0.12, 0.15]
  distance_multipliers: [0.5, 0.8, 1.2]
  short_window_multiplier: 0.5
  long_window_multiplier: 2.0
  height_factor: 0.6
  prominence_factor: 0.25
  long_window_weight: 0.6
