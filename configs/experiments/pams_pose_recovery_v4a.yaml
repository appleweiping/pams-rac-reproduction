# TRAIN337-ONLY POSE-INPUT REPAIR (v4a; no model training authorized here).
#
# Pass 0 is the frozen MediaPipe 0.10.14 complexity-1 pass on the complete
# annotation-compiled official segment timeline.
# The complexity-2 model is allowed to inspect only pass0-missing frames. Its
# official SHA-256 and immutable GCS generation are disclosed by MediaPipe
# v0.10.14 third_party/external_files.bzl:
#   59e42d71bcd44cbdbabc419f0ff76686595fd265419566bd4009ef703ea8e1fe
#   generation=1661875897944151
# The runner never downloads it. A caller must preseed those exact bytes and
# bind-mount them at MediaPipe's package resource path in a network-none run.
#
# A short bilaterally anchored pass0 gap may interpolate only its crop box.
# Pose coordinates are always observed model outputs; internal failed retries
# remain exact-zero invalid holes. The input is the already compiled,
# count-free official-segment sidecar; annotations themselves are never
# mounted. This config is initially authorized only for train337 paired gate.
schema_version: 1
protocol: ucfrep_526
seed: 2026
data:
  # Historical PAMS configs use 256 here. v4a pose extraction explicitly
  # preserves each compiled clip's native timeline and does not consume this
  # value as an extraction target length.
  frames: 256
  keypoints: 33
  coordinates: 3
  normalization: per_frame_minmax
  missing_value: 0.0
pose:
  preprocessing_revision: official-segment-heavy-missing-retry-full-timeline-v4a
  model_id: mediapipe-pose-0.10.14
  model_complexity: 1
  smooth_landmarks: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  crop_to_detected_span: false
  incomplete_clip_policy: pad_invalid_tail
  recovery:
    heavy_model_id: mediapipe-pose-heavy-0.10.14
    model_complexity: 2
    heavy_model_asset_sha256: 59e42d71bcd44cbdbabc419f0ff76686595fd265419566bd4009ef703ea8e1fe
    temporal_resampling: none_native_timeline
    static_image_mode: true
    smooth_landmarks: false
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    full_frame_retry: true
    roi_retry: true
    roi_margin_fraction: 0.20
    roi_min_side_fraction: 0.08
    association_cost: normalized-center-l2-plus-log-scale-v1
    association_center_weight: 1.0
    association_log_scale_weight: 0.25
    dominant_track_strategy: global-viterbi-visible-extent-v1
    maximum_gap_frames: 8
    maximum_gap_seconds: 0.25
    pose_coordinate_interpolation: false
model:
  input_dim: 99
  model_dim: 512
  input_projection_scale: none
  position_encoding_mode: none
  embedding_dim: 512
  layers: 4
  heads: 16
  feedforward_dim: 2048
  dropout: 0.1
  norm_first: false
  period_head_hidden_dim: 128
period:
  minimum: 4
  maximum: 128
  pose_energy_epochs: 10
  training_mode: adaptive
  fixed_period_frames: 16
  post_warmup_source: projected_pose_velocity_vector_acf
loss:
  scales: [0.5, 1.0, 1.5]
  temperature: 0.1
  kmeans_clusters: 8
  kmeans_refresh_epochs: 5
  exclude_other_scale_positives_from_denominator: false
training:
  epochs: 150
  effective_batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 8
  minimum_learning_rate: 0.000001
  position_permutation_consistency_weight: 0.0
  skeleton_augmentation:
    enabled: true
    rotation_degrees: [15.0, 15.0, 15.0]
    scale_range: [0.85, 1.15]
    jitter_std: 0.01
sshead:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  architecture: pointwise_mlp
  input_source: encoder_embedding
  period_confidence_mode: nonzero_gate
  cycle_weight: 1.0
  spectral_weight: 1.0
  variance_weight: 0.1
  smoothness_weight: 0.01
consensus:
  expert_mode: multi
  sigma_multipliers: [0.05, 0.12, 0.15]
  distance_multipliers: [0.5, 0.8, 1.2]
  short_window_multiplier: 0.5
  long_window_multiplier: 2.0
  height_factor: 0.6
  prominence_factor: 0.25
  long_window_weight: 0.6
