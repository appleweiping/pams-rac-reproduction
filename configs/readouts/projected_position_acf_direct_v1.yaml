# These two gates execute before any dev pose, dev identity, or target-bearing
# input can be mounted. Synthetic truth is permitted only inside the bounded
# synthetic gate; the train337 gate consumes no action or count labels.
predev_gates:
  synthetic:
    harmonic_orders: [2, 3, 4, 5, 6, 7]
    frames: 256
    fundamental_period_frames: 64
    fundamental_amplitude: 1.0
    harmonic_amplitude: 0.75
    required_records: 6
    minimum_fundamental_selection_fraction: 1.0
    require_finite_outputs: true
    require_positive_confidence: true
  train337_target_free_distribution:
    required_records: 337
    maximum_zero_confidence_fraction: 0.10
    maximum_minimum_period_fraction: 0.10
    maximum_maximum_period_fraction: 0.10
    maximum_selected_bin_mode_fraction: 0.25
    minimum_unique_selected_bins: 8
    require_finite_outputs: true
    require_zero_confidence_zero_count: true

# This is only a dev84 stop/continue comparison against the already public
