# Independently inferred executable proxy for the Table 2 conventional-TCC
# baseline.  The paper says that baseline uses a fixed window, but it does not
# disclose the selected fixed size or enough conventional-TCC geometry to
# recover the author implementation.  Six window sizes are visible in
# Supplementary Figure 12a; 16 is frozen here before UCFRep dev scoring.
# This config is therefore not eligible to claim the paper's Table 2 value.
schema_version: 1
protocol: ucfrep_526
seed: 2026
data:
  frames: 256
  keypoints: 33
  coordinates: 3
  normalization: per_frame_minmax
  missing_value: 0.0
pose:
  preprocessing_revision: detected-span-minmax-zero-span-invalid-v2
  model_id: mediapipe-pose-0.10.14
  model_complexity: 1
  smooth_landmarks: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  crop_to_detected_span: true
model:
  input_dim: 99
  model_dim: 512
  input_projection_scale: none
  embedding_dim: 512
  layers: 4
  heads: 16
  feedforward_dim: 2048
  dropout: 0.1
  norm_first: false
  period_head_hidden_dim: 128
period:
  minimum: 4
  maximum: 128
  pose_energy_epochs: 10
  training_mode: fixed_period_inferred
  fixed_period_frames: 16
  post_warmup_source: embedding_velocity_coordinate
loss:
  # Table 2 describes the conventional-TCC baseline as non-multi-scale.
  scales: [1.0]
  temperature: 0.1
  kmeans_clusters: 8
  kmeans_refresh_epochs: 5
  exclude_other_scale_positives_from_denominator: false
training:
  epochs: 150
  effective_batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 8
  minimum_learning_rate: 0.000001
sshead:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  cycle_weight: 1.0
  spectral_weight: 1.0
  variance_weight: 0.1
  smoothness_weight: 0.01
consensus:
  expert_mode: multi
  sigma_multipliers: [0.05, 0.12, 0.15]
  distance_multipliers: [0.5, 0.8, 1.2]
  short_window_multiplier: 0.5
  long_window_multiplier: 2.0
  height_factor: 0.6
  prominence_factor: 0.25
  long_window_weight: 0.6
