current_repository_boundary:
  statement: >-
    The tracked repository is a single-person PAMS reproduction and does not
    implement the proposed multi-person repetition-counting method.
  status: CONFIRMED
  evidence_class: tracked_code_and_docs
  sources: [tracked_method_spec, tracked_assumptions, tracked_model]

task:
  status: PROVISIONAL
  evidence_class: user_approved_formulation
  sync_required: true
  inputs:
    pose_trajectory: {symbol: "X_i", shape: "T_i x J x C"}
    validity_mask: {symbol: "m_i", shape: "T_i"}
  primary_output:
    symbol: "hat_c"
    representation: "[hat_c_1, ..., hat_c_N]^T"
  derived_diagnostics:
    - {symbol: "sum_i hat_c_i", description: "scene total; never the primary task definition"}
  supervision_claim:
    allowed_text: "without person-wise count or period supervision in the intended counting objective"
    prohibited_shortcuts: [annotation_free, label_free, fully_self_supervised_pipeline]
    status: BLOCKED
    evidence_class: intended_contract_not_yet_source_audited
    sync_required: true
    firewall_scope:
      - dataset_loaders
      - pseudo_label_generation
      - losses
      - router_inputs_and_targets
      - hyperparameter_tuning
      - checkpoint_selection
      - early_stopping
      - calibration
      - prediction_and_inference
    required_artifact: paper/evidence/supervision_firewall.json

