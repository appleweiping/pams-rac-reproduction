current_result_evidence:
  status: CONFIRMED_INELIGIBLE
  table_eligible: false
  sources: [results/README.md, results/dev-negative/README.md, results/dev-negative/summary.json]
  reasons:
    - single_person_ucfrep_dev84
    - negative_or_diagnostic_only
    - proxy_rows_present
    - pams_literal_period_head_random_and_untrained
    - pams_sshead_is_an_inferred_repair
    - sealed_test105_untouched
    - no_multirep_results

forbidden_claims:
  - current_repository_implements_mrac
  - first_multi_person_or_person_wise_rac
  - first_asynchronous_or_variable_tempo_rac
  - first_pose_or_self_supervised_rac
  - annotation_free
  - label_free
  - end_to_end
  - constant_time
  - state_of_the_art_without_matched_protocol_audit

handoff_rule:
  collaborator_code_wins: true
  action_on_mismatch:
    - rewrite_method_equations
    - rewrite_claims_evidence_matrix
    - record_difference_in_chinese_sync_report
    - rerun_contract_review
