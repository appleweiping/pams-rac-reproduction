schema_version: "2.0"
contract_id: rac-cvpr27-method-pre-results
working_title: "Count Each Person at Their Changing Pace: Multi-Person Tempo-Adaptive Repetition Counting"
venue: "CVPR 2027"
evidence_freeze: "73cbc4bb9b581f24fbc90f2fe7421bc11e7c7454"
overall_status: "provisional/data-pending"
template_status: "CVPR2027-template-pending"
assurance: submission
anonymous: true

machine_readable_contracts:
  story: paper/evidence/story_contract.json
  notation: paper/evidence/notation_inventory.json
  freeze: paper/evidence/freeze_inventory.json
  result_manifest_schema: paper/evidence/result_manifest.schema.json

source_priority:
  - {rank: 1, source_class: collaborator_final_artifact, present: false, authority: final}
  - {rank: 2, source_class: tracked_code_and_docs, present: true, authority: current_repository_only}
  - {rank: 3, source_class: committed_ppt, present: true, authority: visual_reference_only}
  - {rank: 4, source_class: untracked_prose, present: true, authority: informal_only}

transition_schema:
  component_definition: >-
    A component is one ordered module or one training-objective term listed in
    this file. No unlabeled nested component may be used in the paper.
  required_fields:
    - id
    - status
    - sync_required
    - evidence_class
    - sources
    - implementation_anchors
    - test_artifacts
    - closure_rule
  anchor_fields: [path, symbol, commit, sha256, verdict]
  test_fields: [id, path, commit, sha256, verdict]
  allowed_component_statuses: [BLOCKED, CONFIRMED]
  allowed_verdicts: [PASS, BLOCKED, FAIL]
  closure_rule: >-
    A component may change from BLOCKED to CONFIRMED only when at least one
    implementation anchor and every required test artifact have non-null paths,
    sha256 digests, the collaborator freeze commit, and PASS verdicts.

collaborator_freeze:
  status: BLOCKED
  commit: null
  repository_root: null
  manifest_path: null
  manifest_sha256: null
  rule: >-
    The final collaborator commit, repository root, and manifest digest must be
    frozen together before any proposed component can become CONFIRMED.

