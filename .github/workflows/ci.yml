name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test (portable public checkout)
        # Five historical WARP-PHASE assertions require an exact frozen
        # CPython/NumPy runtime or an ignored 125 MB local fixture pack.
        # Keep those assertions in the repository for their pinned-runtime
        # replay; do not treat a generic Actions image as that environment.
        run: |
          pytest --cov=pams --cov-report=term-missing \
            --deselect=tests/test_cli.py::test_warp_phase_group_is_attached_and_non_authorizing \
            --deselect=tests/test_warp_phase_gates.py::test_frozen_schema_pcg64_and_k4_bytes \
            --deselect=tests/test_warp_phase_gates.py::test_static_receipt_is_non_authorizing_canonical_json \
            --deselect=tests/test_warp_phase_gates.py::test_training_environment_lock_is_canonical_exclusive_and_live \
            --deselect=tests/test_warp_phase_selector.py::test_fixture_id10_failure_preserves_computed_diagnostics
